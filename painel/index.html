async function blocoPreco(t,op,el){if(!el)return;if(!t){el.innerHTML='';return;}
 el.innerHTML='<span class="m">Comparando com contratos já assinados no PNCP…</span>';
 const ref=op?.valor_sigiloso?null:Number(op?.valor_estimado||0)||null;
 // termo cheio costuma ser restritivo demais: afrouxa até achar base de comparação
 const pal=t.split(' ').filter(Boolean),tentativas=[...new Set([t,pal.slice(0,2).join(' '),pal[0]])].filter(Boolean);
 let P={},tq=t;
 for(const termo of tentativas){const r=await sb.rpc('precos_referencia',{q:termo,p_uf:null,p_estimado:ref});
  if(r.error){el.innerHTML=`<div class="dwarn">Não deu para calcular agora: ${esc(r.error.message)}</div>`;return;}
  P=r.data||{};tq=termo;if(P.n>0||P.n_total>=5)break;}
 const faixa=P.n>0;                                        // tem contratos de porte parecido?
 const V=(await sb.rpc('vencedores_parecidos',{q:tq,p_uf:null,p_limite:10,p_ordem:'valor',p_estimado:faixa?ref:null})).data||[];
 const desc=P.desconto_disputa!=null?P.desconto_disputa:(faixa?P.desconto_contratos:null);
 const base=P.desconto_disputa!=null?`${P.nh} compra(s) homologada(s): estimado x fechado`:`indicação a partir de ${P.n} contrato(s) de porte parecido`;
 el.innerHTML=`<div class="pzg">
  <div class="pzc ref"><span>Referência do edital</span><b>${ref?brl(ref):'sigiloso'}</b><i>o que o órgão estimou pagar</i></div>
  <div class="pzc"><span>Desconto típico</span><b>${desc!=null?pct(desc):'—'}</b><i>${desc!=null?base:'ainda sem contrato de porte parecido'}</i></div>
  <div class="pzc"><span>Fechamento provável</span><b>${P.fechamento_provavel!=null?brl(P.fechamento_provavel):'—'}</b><i>por quanto este contrato tende a fechar</i></div>
  <div class="pzc ${P.margem>0?'ok':''}"><span>Espaço até a referência</span><b>${P.margem!=null?brl(P.margem):'—'}</b><i>folga entre o teto e o preço provável</i></div>
 </div>
 ${faixa?`<div class="m" style="margin-top:6px">Base: ${P.n} contrato(s) de porte comparável (de ${P.n_total} encontrados) — menor ${brl(P.min)} · típico ${brl(P.mediana)} · maior ${brl(P.max)}.</div>`
 :P.n_total?`<div class="m" style="margin-top:6px">Nenhum contrato de porte parecido com ${ref?brl(ref):'este edital'} ainda. Os ${P.n_total} contrato(s) achados para este objeto vão de ${brl(P.min_todos)} a ${brl(P.max_todos)} (típico ${brl(P.mediana_todos)}) — portes diferentes, serve só como referência do setor.</div>`
 :'<div class="m" style="margin-top:6px">Ainda sem contratos parecidos na base. O histórico do PNCP entra aos poucos (10 dias por coleta, indo até 180 dias), então isso melhora bastante nas próximas semanas.</div>'}
 ${V.length?`<div class="m" style="margin-top:10px"><b>Quem já vendeu isso ao governo:</b> vencedores de contratos recentes parecidos com “${esc(tq)}” e de valor semelhante. A busca é por texto, então confira se o objeto é mesmo equivalente.</div><div style="overflow-x:auto"><table class="tb" style="margin-top:8px"><tr><th>Quem ganhou</th><th>Órgão</th><th>Data</th><th>Valor do contrato</th></tr>${V.map(x=>`<tr><td><b>${esc(x.fornecedor||'')}</b><div class="m">${esc(x.cnpj||'')}</div></td><td class="m">${esc(x.orgao||'')}/${esc(x.uf||'')}</td><td class="m">${dt(x.data+'T12:00')}</td><td>${brl(x.valor)}</td></tr>`).join('')}</table></div>
 <div class="m" style="margin-top:5px">Do mais barato ao mais caro. São contratos inteiros (quantidades diferentes): ordem de grandeza, não preço unitário. Termo pesquisado: “${esc(tq)}”.</div>`:''}`;}

const deSel=b=>b.closest('.dac').querySelector('.de')?.value||'';
const NVL={alto:'Risco alto',medio:'Risco médio',baixo:'Risco baixo'};

function pintarDet(d,a){const c=d.__ctx,x=a?.dados||{},h=x.habilitacao||{},its=c.its,emps=c.emps,id=c.id;
 const r=a?.risco,nv=r==null?null:(r>=66?'alto':r>=36?'medio':'baixo');
 const kv=(rot,v)=>v?`<div><span>${rot}</span><b>${esc(v)}</b></div>`:'';
 const kb=(rot,v,alertaSeSim)=>v==null?'':`<div><span>${rot}</span><b class="${v?(alertaSeSim?'bw':'bo'):'bn'}">${v?'Sim':'Não'}</b></div>`;
 const cond=[kv('Critério de julgamento',x.criterio_julgamento),kv('Local de entrega',x.local_entrega),kv('Pagamento',x.pagamento),kv('Garantia exigida',x.garantia),
  kb('Exige amostra',x.exige_amostra,true),kb('Exige visita técnica',x.exige_visita_tecnica,true),kb('Exclusivo ME/EPP',x.exclusivo_me_epp,false)].join('');
 const fim=c.op?.data_fim_proposta,dd=fim?dias(fim):null;
 const prazos=[fim?`<div><span>Propostas até</span><b>${dt(fim)}${dd!=null?` <small class="${dd<0?'bw':dd<=3?'bw':'m'}">(${dd<0?'encerrado':dd===0?'hoje':'em '+dd+' dia'+(dd>1?'s':'')})</small>`:''}</b></div>`:'',kv('Prazo de entrega',x.prazo_entrega),kv('Vigência do contrato',x.vigencia)].join('');
 const riscos=x.riscos||[],exJF=[...(h.juridica||[]),...(h.fiscal_trabalhista||[])],exTE=[...(h.tecnica||[]),...(h.economico_financeira||[])];
 d.innerHTML=`<div class="danl">`+(a?`<div class="dsum">${r!=null?`<div class="dscore ${nv}"><b>${r}</b><span>risco</span></div>`:''}
  <div><div class="dtop">${AI('Análise do edital gerada por IA (Gemini)')}<b>${r!=null?NVL[nv]:'Análise do edital'}</b><span class="tag ${a.fonte==='edital'?'ok':'w'}">${a.fonte==='edital'?'lido do edital completo':'lido só pelo objeto'}</span></div>
  <p class="dres">${esc(a.resumo||x.resumo||'')}</p>
  ${x.oportunidade?`<p class="dres"><b>Vale a pena? </b>${esc(x.oportunidade)}</p>`:''}
  ${x.perfil_fornecedor?`<p class="dres m"><b>Quem atende isso: </b>${esc(x.perfil_fornecedor)}</p>`:''}</div></div>
  ${prazos?`<h4>Prazos</h4><div class="dkv">${prazos}</div>`:''}
  ${cond?`<h4>Condições principais</h4><div class="dkv">${cond}</div>`:''}
  ${riscos.length?`<h4>Pontos de atenção</h4><div class="drk">${riscos.map(z=>`<div class="dr ${esc(z.nivel||'medio')}"><b>${esc(z.tema||'Atenção')}</b><span>${esc(z.descricao||'')}</span></div>`).join('')}</div>`:''}
  ${(exJF.length||exTE.length)?`<h4>Exigências para participar</h4><div class="dex"><div><h5>Jurídica, fiscal e trabalhista</h5>${lista(exJF)}</div><div><h5>Técnica e econômico-financeira</h5>${lista(exTE)}</div></div>`:''}
  <div class="dfoot"><a class="l" style="cursor:pointer" onclick="analisarAgora(this.closest('.det'))">analisar de novo</a></div>`
  :'<div class="m">Lendo o edital com a IA… isso leva alguns segundos.</div>')+`</div>`
 +(its.length?`<h4>Itens (${its.length}${its.length===15?'+':''})</h4><table class="tb">${its.map(i=>`<tr><td>${i.numero_item}</td><td>${esc((i.descricao||'').slice(0,110))}</td><td>${i.quantidade??''} ${esc(i.unidade||'')}</td><td>${i.valor_unitario!=null?brl2(i.valor_unitario):'sigiloso'}</td></tr>`).join('')}</table>`:'')
 +`<div class="darq"></div><h4>Pergunte ao edital</h4><div class="ask"><input placeholder="Ex.: aceita atestado de outro estado? qual o prazo de entrega?" onkeydown="if(event.key==='Enter')this.nextElementSibling.click()"><button class="sm" onclick="runIA(this,'pergunta',${id},{pergunta:this.previousElementSibling.value})">${AI()}Perguntar</button></div>
 <div class="iaout" hidden></div>
 <h4>Preço: referência, quanto já foi pago e margem</h4><div class="pz"></div>
 <h4>Quem já vende isso para o governo</h4><div class="mk"></div>
 <div class="dfoot"><button class="gh" onclick="runIA(this,'termos',${id})">${ic('preco')}Sugerir termos para pesquisar preço (IA)</button></div>
 <details class="dac"><summary>Materiais para levar a uma empresa (IA)</summary>`
 +(emps.length?`<div class="row2"><span class="m">Empresa:</span><select class="de" style="width:210px">${emps.map(e=>`<option value="${e.id}">${esc(e.nome)}${e.propria?' (minha)':''}</option>`).join('')}</select></div>
  <div class="row2"><button class="sec sm" onclick="runIA(this,'checklist',${id},{empresa_id:deSel(this)})">Documentos que faltam para ela participar</button><button class="sec sm" onclick="runIA(this,'proposta',${id},{empresa_id:deSel(this)})">Rascunho de proposta e declarações</button><button class="sec sm" onclick="runIA(this,'abordagem',${id},{empresa_id:deSel(this),canal:'whatsapp'})">Mensagem de WhatsApp</button><button class="sec sm" onclick="runIA(this,'abordagem',${id},{empresa_id:deSel(this),canal:'email'})">E-mail de abordagem</button></div>`
  :`<div class="m">Cadastre uma empresa em <a class="l" style="cursor:pointer" onclick="ir('empresas')">Empresas</a> para gerar o checklist de habilitação dela, rascunho de proposta e mensagens de abordagem.</div>`)+`</details>`;}
async function checkProc(btn,op,emp){return runIA(btn,'checklist',op,{empresa_id:emp});}
const DOCT=['Contrato social / estatuto','Cartão CNPJ','CND Federal (RFB/PGFN)','CND Estadual','CND Municipal','Certidão FGTS (CRF)','CNDT (trabalhista)','Balanço patrimonial','Certidão de falência','Atestado de capacidade técnica','Registro em conselho (CREA/CRA/etc.)','Alvará / licença sanitária','Outro'];
async function addDoc(eid,btn){const b=btn.closest('.docs'),t=b.querySelector('.dt').value,n=b.querySelector('.dn').value.trim(),v=b.querySelector('.dv').value||null;const {error}=await sb.from('empresa_docs').insert({empresa_id:eid,tipo:t,numero:n||null,validade:v});if(error)return alert('Erro: '+error.message);ir('empresas');}
async function delDoc(id){if(!confirm('Remover este documento?'))return;const {error}=await sb.from('empresa_docs').delete().eq('id',id);if(error)return alert('Erro: '+error.message);ir('empresas');}
async function aplicarPrompt(id,ok){const p=(await q(sb.from('perfis_busca').select('prompt_sugerido').eq('id',id).single())).data;const v=ok?{prompt:p.prompt_sugerido,prompt_sugerido:null,prompt_sugerido_motivo:null}:{prompt_sugerido:null,prompt_sugerido_motivo:null};const {error}=await sb.from('perfis_busca').update(v).eq('id',id);if(error)return alert('Erro: '+error.message);ir('perfis');}

async function buscaMercado(){const t=$('#mq').value.trim(),uf=$('#mu').value;if(!t)return;await blocoMercado(t,uf,'#mres',40);
 const {data}=await sb.rpc('contratos_parecidos',{q:t,p_uf:uf||null,p_limite:25});const el=$('#mct');el.hidden=!(data||[]).length;el.innerHTML=`<h3 style="margin:0 0 8px;font-size:14px">Contratos recentes</h3><table class="tb"><tr><th>Data</th><th>Objeto</th><th>Órgão</th><th>Fornecedor</th><th>Valor</th></tr>${(data||[]).map(c=>`<tr><td class="m">${dt(c.data+'T12:00')}</td><td>${esc(c.objeto)}</td><td class="m">${esc(c.orgao||'')}/${esc(c.uf||'')}</td><td class="m">${esc(c.fornecedor||'')}</td><td>${brl(c.valor)}</td></tr>`).join('')}</table>`;}
async function papel(e,p){const {error}=await sb.rpc('definir_papel',{p_email:e,p_papel:p});alert(error?('Erro: '+error.message):'Papel atualizado.');}
const irProc=id=>ir('processos',{op:id});
const comProc=p=>{const vp=Number(p.valor_proposta||0),mg=Math.max(vp-Number(p.custo||0),0),base=p.base_tipo==='margem'?mg:vp;return {mg,com:base*Number(p.percentual??1)/100};};
async function novaEmpresa(){const n=$('#en').value.trim();if(!n)return alert('Informe o nome da empresa');
 const {error}=await sb.from('empresas').insert({nome:n,cnpj:$('#ec').value.trim()||null,contato:$('#et').value||null,email:$('#ee').value||null,telefone:$('#ef').value||null,uf:$('#eu').value||null,observacoes:$('#eo').value||null,propria:$('#ep').checked});
 if(error)alert(error.message);else ir('empresas');}
async function delEmpresa(id,n){if(!confirm('Excluir a empresa '+n+'? Os processos dela também serão apagados.'))return;const {error}=await sb.from('empresas').delete().eq('id',id);if(error)alert(error.message);else ir('empresas');}
async function novoProc(){const t=$('#pt').value.trim();if(!t)return alert('Informe o objeto do processo');const num=v=>v===''?null:Number(v),d=$('#pd').value;
 const {error}=await sb.from('processos').insert({empresa_id:Number($('#pe').value),oportunidade_id:PR.op,titulo:t,orgao:$('#po').value||null,uf:$('#pu').value||null,link_pncp:$('#pl').value||null,data_sessao:d?new Date(d).toISOString():null,valor_proposta:num($('#pv').value),custo:num($('#pc').value),base_tipo:$('#pb').value,percentual:Number($('#pp').value||1),observacoes:$('#pob').value||null});
 if(error)alert(error.message);else ir('processos',{emp:$('#pe').value});}
async function listarProc(){
 let r=sb.from('processos').select('*,empresas(nome,cnpj,propria)').order('criado_em',{ascending:false}).limit(200);
 if($('#fe').value)r=r.eq('empresa_id',$('#fe').value);const s=$('#fs2').value;
 if(s==='abertos')r=r.not('status','in','(ganho,perdido,desistiu)');else if(s)r=r.eq('status',s);
 const {data}=await q(r);
 const ab=data.filter(p=>!['ganho','perdido','desistiu'].includes(p.status)),vab=ab.reduce((a,p)=>a+Number(p.valor_proposta||0),0),cab=ab.reduce((a,p)=>a+comProc(p).com,0),gan=data.filter(p=>p.status==='ganho');
 $('#plist').innerHTML=(data.length?`<div class="grid"><div class="card"><div class="m">Em andamento</div><div class="kpi">${ab.length}</div></div><div class="card"><div class="m">Valor das propostas em andamento</div><div class="kpi">${brl(vab)}</div></div><div class="card"><div class="m">Comissão potencial</div><div class="kpi g">${brl(cab)}</div></div><div class="card"><div class="m">Ganhos</div><div class="kpi">${gan.length}</div></div></div>`:'')
 +(data.length?data.map(p=>{const c=comProc(p);return `<div class="card"><div class="row"><div><div class="t">${esc((p.titulo||'').slice(0,220))}</div><div class="m">${esc(p.empresas?.nome)}${p.empresas?.propria?' (minha)':''} · ${esc(p.orgao||'')} ${p.uf?'· '+esc(p.uf):''}${p.data_sessao?' · sessão '+new Date(p.data_sessao).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'}):''}</div>${p.link_pncp?`<a class="l" href="${esc(p.link_pncp)}" target="_blank" rel="noopener">abrir no PNCP ↗</a> `:''}<button class="sec sm" onclick="irPreco(this.dataset.t)" data-t="${esc((p.titulo||'').slice(0,80))}">Pesquisar preço</button> ${gcal(p)}</div>
 <select style="width:150px" onchange="updProc(${p.id},{status:this.value})">${opts(PSTAT,p.status)}</select></div>
 <div class="f2" style="grid-template-columns:repeat(4,1fr);margin-top:6px"><div><label>Valor da proposta</label><input type="number" step="0.01" value="${p.valor_proposta??''}" onchange="updProc(${p.id},{valor_proposta:this.value===''?null:Number(this.value)})"></div><div><label>Custo total</label><input type="number" step="0.01" value="${p.custo??''}" onchange="updProc(${p.id},{custo:this.value===''?null:Number(this.value)})"></div><div><label>Base da comissão</label><select onchange="updProc(${p.id},{base_tipo:this.value})">${opts(['contrato','margem'],p.base_tipo)}</select></div><div><label>Percentual (%)</label><input type="number" step="0.01" value="${p.percentual??1}" onchange="updProc(${p.id},{percentual:Number(this.value)})"></div></div>
 <div style="margin-top:8px"><span class="tag">margem ${brl(c.mg)}</span><span class="tag ok">comissão ${brl(c.com)}</span>${p.status==='ganho'&&!p.comissao_gerada?`<button class="sm" style="margin-left:6px" onclick="gerarCom(${p.id})">Gerar contrato de comissão</button>`:''}${p.comissao_gerada?'<span class="tag">comissão lançada</span>':''}${p.oportunidade_id?`<button class="sec sm" style="margin-left:6px" onclick="checkProc(this,${p.oportunidade_id},${p.empresa_id})">Checklist de habilitação (IA)</button>`:''}<button class="bad sm" style="float:right" onclick="delProc(${p.id})">Excluir</button></div><div class="iaout" hidden></div></div>`}).join(''):'<div class="card vazio">Nenhum processo por aqui. Abra um a partir de um edital (botão “Iniciar processo”) ou pelo formulário acima.</div>');}
async function updProc(id,v){const {error}=await sb.from('processos').update(v).eq('id',id);if(error)alert('Erro: '+error.message);await listarProc();}
async function delProc(id){if(!confirm('Excluir este processo?'))return;await sb.from('processos').delete().eq('id',id);await listarProc();}
async function gerarCom(id){const {data:p}=await q(sb.from('processos').select('*,empresas(nome,cnpj)').eq('id',id).single());const c=comProc(p),bv=p.base_tipo==='margem'?c.mg:Number(p.valor_proposta||0);
 const {error}=await sb.from('contratos_comissao').insert({empresa_nome:p.empresas.nome,empresa_cnpj:p.empresas.cnpj,base_tipo:p.base_tipo,base_valor:bv,percentual:p.percentual,valor_estimado_comissao:c.com});
 if(error)return alert(error.message);await sb.from('processos').update({comissao_gerada:true}).eq('id',id);await listarProc();alert('Contrato de comissão lançado na tela Comissões.');}

async function upd(t,id,v){const {error}=await sb.from(t).update(v).eq('id',id);if(error)alert('Erro: '+error.message);}
const mudarStatus=(id,s)=>upd('radar',id,{status:s}),mudarEtapa=(id,e)=>upd('matches',id,{etapa:e});
function calcCom(){const v=Number($('#cv').value||0),p=Number($('#cp').value||0);$('#ce').value=v?brl(v*p/100):'';}
async function updCom(id,v){const {data:c,error}=await sb.from('contratos_comissao').update(v).eq('id',id).select().single();if(error)return alert('Erro: '+error.message);
 if(c.base_valor!=null){await sb.from('contratos_comissao').update({valor_estimado_comissao:Number(c.base_valor)*Number(c.percentual??1)/100}).eq('id',id);}ir('comissoes');}
async function novaCom(){if(!$('#cn').value)return alert('Informe a empresa');const bv=$('#cv').value===''?null:Number($('#cv').value),p=Number($('#cp').value||1);
 const {error}=await sb.from('contratos_comissao').insert({empresa_nome:$('#cn').value,empresa_cnpj:$('#cc').value||null,base_tipo:$('#cb').value,base_valor:bv,percentual:p,valor_estimado_comissao:bv==null?null:bv*p/100});if(error)alert(error.message);else ir('comissoes');}
async function novoPerfil(){const n=prompt('Nome do novo perfil:');if(!n)return;const {error}=await sb.from('perfis_busca').insert({nome:n});if(error)alert(error.message);else ir('perfis');}
$('#lg').innerHTML=$('#lg2').innerHTML=svg('doc');$('#lg').firstChild.style.cssText=$('#lg2').firstChild.style.cssText='width:22px;height:22px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round';
$('#pw').onkeydown=e=>{if(e.key==='Enter')entrar();};
iniciar();
