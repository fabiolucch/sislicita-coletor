<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SISLICITA</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f8fafc;--card:#fff;--bd:#e2e8f0;--tx:#1e293b;--mut:#64748b;--pri:#24436f;--pri2:#e8eef7;--pri3:#2f5a94;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--r:12px;--sh:0 1px 2px #0f172a0d,0 1px 3px #0f172a0a}
*{box-sizing:border-box}body{margin:0;font:14px/1.5 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased}
#login{display:none;min-height:100vh;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 1px 1px,#ffffff14 1px,transparent 0) 0 0/22px 22px,linear-gradient(135deg,#0f1f38,#24436f 55%,#1b3358)}
#login .box{width:100%;max-width:380px;background:#fff;border-radius:16px;padding:32px 30px;box-shadow:0 20px 50px #0008}
.logo{display:flex;align-items:center;gap:10px;margin-bottom:6px}.logo i{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#24436f,#3b6aa8);display:grid;place-items:center;color:#fff}
.logo b{font-size:21px;color:var(--pri);letter-spacing:.3px}#login p{margin:0 0 20px;color:var(--mut)}
input,select,textarea,button{font:inherit}input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--bd);border-radius:8px;background:#fff;color:var(--tx)}
input:focus,select:focus,textarea:focus{outline:3px solid #24436f22;border-color:var(--pri)}
button{cursor:pointer;border:0;border-radius:8px;padding:9px 16px;background:var(--pri);color:#fff;font-weight:500;transition:.15s}button:hover{background:var(--pri3)}button:disabled{opacity:.45;cursor:default}
button.sec{background:var(--pri2);color:var(--pri)}button.sec:hover{background:#d8e3f3}button.bad{background:#fee2e2;color:var(--bad)}button.sm{padding:5px 11px;font-size:12.5px}
#app{display:none;min-height:100vh}
aside{position:fixed;inset:0 auto 0 0;width:236px;background:linear-gradient(180deg,#0f1f38,#24436f);color:#cbd5e1;padding:18px 12px;display:flex;flex-direction:column;overflow-y:auto}
aside .logo{padding:2px 8px 18px;margin:0}aside .logo i{background:#ffffff1f}aside .logo b{color:#fff}
aside .gr{font-size:10.5px;letter-spacing:.9px;text-transform:uppercase;color:#7f93b3;margin:14px 10px 6px;font-weight:600}
aside a{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:8px;color:#d6e0ee;text-decoration:none;margin-bottom:2px;cursor:pointer;font-weight:500;transition:.15s}
aside a svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
aside a:hover{background:#ffffff14;color:#fff}aside a.on{background:#fff;color:var(--pri);box-shadow:var(--sh)}aside a.on svg{opacity:1}
aside .sair{margin-top:auto;background:#ffffff14;color:#e2e8f0;display:flex;align-items:center;justify-content:center;gap:8px}aside .sair:hover{background:#ffffff26}
aside .user{font-size:11.5px;color:#8da2c3;padding:10px 8px 8px;word-break:break-all}
main{margin-left:236px;padding:26px 32px;max-width:1280px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}h2{margin:0;font-size:22px;font-weight:700;letter-spacing:-.2px}.sub{color:var(--mut);margin:3px 0 0}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;background:#fff;border:1px solid var(--bd);border-radius:var(--r);padding:12px;box-shadow:var(--sh)}.bar>*{width:auto;min-width:130px}.bar input[type=search],.bar input.grow{flex:1;min-width:220px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:15px 18px;margin-bottom:11px;box-shadow:var(--sh)}
.row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.t{font-weight:600}.m{color:var(--mut);font-size:12.5px}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:500;background:var(--pri2);color:var(--pri);margin:5px 6px 0 0}.tag.ok{background:#dcfce7;color:#15803d}.tag.w{background:#fef3c7;color:#b45309}.tag.b{background:#fee2e2;color:#b91c1c}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-bottom:16px}.grid .card{margin:0}.kpi{font-size:27px;font-weight:700;color:var(--pri);letter-spacing:-.5px}.kpi.g{color:var(--ok)}
.ic{width:34px;height:34px;border-radius:9px;background:var(--pri2);color:var(--pri);display:grid;place-items:center;margin-bottom:8px}.ic svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.cols{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(240px,1fr);gap:12px;overflow-x:auto}.col h3{font-size:12px;color:var(--mut);margin:0 0 8px;text-transform:uppercase;letter-spacing:.6px}
table{width:100%;border-collapse:collapse}td,th{padding:9px 8px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}th{color:var(--mut);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.4px}tr:last-child td{border-bottom:0}
label{display:block;font-size:12px;font-weight:500;color:var(--mut);margin:9px 0 4px}a.l{color:var(--pri3);text-decoration:none;font-weight:500}a.l:hover{text-decoration:underline}.vazio{color:var(--mut);padding:34px;text-align:center}
.pg{display:flex;gap:10px;align-items:center;justify-content:center;margin-top:14px}.f2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.pbox{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}.pbox .card{margin:0;text-align:center}.pbox .big{font-size:23px;font-weight:700;color:var(--pri)}.pbox .big.g{color:var(--ok)}
.res{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}.res button{text-align:left;background:#fff;color:var(--tx);border:1px solid var(--bd);box-shadow:var(--sh)}.res button:hover{border-color:var(--pri);background:var(--pri2)}
@media(max-width:860px){aside{position:static;width:auto;flex-direction:row;align-items:center;overflow-x:auto;padding:8px;gap:4px}aside #nav{display:flex;gap:4px}aside .logo,aside .gr,aside .user{display:none}aside a{white-space:nowrap;margin:0}aside .sair{margin:0 0 0 auto;white-space:nowrap;width:auto}main{margin:0;padding:16px;min-width:0}body{overflow-x:hidden}.f2{grid-template-columns:1fr!important}table{display:block;overflow-x:auto}.f2{grid-template-columns:1fr}.top{flex-direction:column;align-items:flex-start}}
</style>
</head>
<body>
<div id="login"><div class="box"><div class="logo"><i id="lg"></i><b>SISLICITA</b></div><p>Radar de licitações públicas</p>
<label>E-mail</label><input id="em" type="email" autocomplete="username">
<label>Senha</label><input id="pw" type="password" autocomplete="current-password">
<p id="err" style="color:var(--bad);margin:10px 0 0"></p><button style="width:100%;margin-top:14px" onclick="entrar()">Entrar</button></div></div>
<div id="app"><aside><div class="logo"><i id="lg2"></i><b>SISLICITA</b></div><div id="nav"></div><div class="user" id="usr"></div><button class="sair" onclick="sair()">Sair</button></aside><main id="main"></main></div>
<script>
// Chave "anon" é pública por desenho; o acesso real é protegido pelo RLS + login.
const SUPABASE_URL="https://tkbkkqebsxvmxnqiwjfl.supabase.co";
const SUPABASE_ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRrYmtrcWVic3h2bXhucWl3amZsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM5MDk1MjIsImV4cCI6MjEwOTQ4NTUyMn0.v--eJcYHEanBh9WG1xgOP-jPGwbR_fikk65AkvMPEaI";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const $=s=>document.querySelector(s), main=$('#main');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl=v=>v==null?'—':Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0});
const dt=v=>v?new Date(v).toLocaleDateString('pt-BR'):'—';
const dias=v=>v?Math.ceil((new Date(v)-Date.now())/864e5):null;
const UFS="AC AL AM AP BA CE DF ES GO MA MG MS MT PA PB PE PI PR RJ RN RO RR RS SC SE SP TO".split(' ');
const STATUS=['novo','analisando','em_abordagem','participando','ganho','perdido','descartado'];
const ETAPAS=['listado','contatado','reuniao','contrato_assinado','habilitacao','proposta','resultado','descartado'];
const opts=(a,sel)=>a.map(x=>`<option ${x===sel?'selected':''}>${esc(x)}</option>`).join('');
const P={home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',radar:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><path d="M12 12l6-6"/>',list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',cal:'<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',tag:'<path d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1"/>',funnel:'<path d="M3 4h18l-7 8v7l-4 2v-9z"/>',coin:'<circle cx="12" cy="12" r="9"/><path d="M15 9.5c-.5-1-1.6-1.5-3-1.5-1.7 0-3 .8-3 2s1.2 1.7 3 2 3 .8 3 2-1.3 2-3 2c-1.4 0-2.5-.5-3-1.5M12 6v2m0 8v2"/>',sliders:'<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>',db:'<ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>',out:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>',doc:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6M8 13h8M8 17h8"/>'};
const svg=k=>`<svg viewBox="0 0 24 24">${P[k]}</svg>`;
const GRUPOS=[['Visão geral',[['home','Início','home'],['radar','Radar','radar']]],['Oportunidades',[['oportunidades','Editais abertos','list'],['pca','PCA (previsão)','cal'],['precos','Preços','tag']]],['Negócios',[['funil','Funil','funnel'],['comissoes','Comissões','coin']]],['Sistema',[['perfis','Perfis de busca','sliders'],['coletas','Coletas','db']]]];
const TELAS=Object.fromEntries(GRUPOS.flatMap(g=>g[1]).map(x=>[x[0],x[1]]));
let tela='home';

async function entrar(){const {error}=await sb.auth.signInWithPassword({email:$('#em').value,password:$('#pw').value});if(error)$('#err').textContent='Falha no login: '+error.message;else iniciar();}
async function sair(){await sb.auth.signOut();location.reload();}
async function iniciar(){const {data}=await sb.auth.getSession();if(!data.session){$('#login').style.display='flex';return;}$('#login').style.display='none';$('#usr').textContent=data.session.user.email;$('#app').style.display='block';ir(location.hash.slice(1)||'home');}
function ir(t,arg){if(!TELAS[t])t='home';tela=t;window.ARG=arg;location.hash=t;scrollTo(0,0);$('#nav').innerHTML=GRUPOS.map(([g,its])=>`<div class="gr">${g}</div>`+its.map(([k,v,i])=>`<a class="${k===t?'on':''}" onclick="ir('${k}')">${svg(i)}${v}</a>`).join('')).join('');main.innerHTML='<div class="vazio">Carregando…</div>';V[t]().catch(e=>main.innerHTML=`<div class="vazio">Erro: ${esc(e.message)}</div>`);}
const q=async p=>{const {data,error,count}=await p;if(error)throw error;return {data,count};};
const prazo=v=>{const d=dias(v);return d==null?'':`<span class="tag ${d<=5?'w':'ok'}">${d>=0?d+' dias':'encerrado'}</span>`;};

const V={
async home(){
 const now=new Date().toISOString();
 const cnt=(t,f)=>q(f(sb.from(t).select('id',{count:'exact',head:true}))).then(r=>r.count);
 const [ab,rd,pc,cm,top]=await Promise.all([cnt('oportunidades',r=>r.gte('data_fim_proposta',now)),cnt('radar',r=>r.not('oportunidade_id','is',null)),cnt('pca_demanda',r=>r),
  q(sb.from('contratos_comissao').select('base_valor,percentual,valor_estimado_comissao,valor_recebido')).then(r=>r.data),
  q(sb.from('radar').select('id,score,status,oportunidades!inner(objeto,orgao_nome,uf,valor_estimado,valor_sigiloso,data_fim_proposta)').gte('oportunidades.data_fim_proposta',now).order('score',{ascending:false}).limit(6)).then(r=>r.data)]);
 const est=cm.reduce((s,c)=>s+(c.base_valor==null?Number(c.valor_estimado_comissao||0):Number(c.base_valor)*Number(c.percentual??1)/100),0),rec=cm.reduce((s,c)=>s+Number(c.valor_recebido||0),0);
 const K=(i,l,v,c='')=>`<div class="card"><div class="ic">${svg(i)}</div><div class="m">${l}</div><div class="kpi ${c}">${v}</div></div>`;
 main.innerHTML=`<div class="top"><div><h2>Bem-vindo ao SISLICITA</h2><p class="sub">Garimpe oportunidades, conheça os preços de mercado e acompanhe suas comissões.</p></div><div><button onclick="ir('precos')">Pesquisar preços</button></div></div>
 <div class="grid">${K('list','Editais abertos',ab.toLocaleString('pt-BR'))}${K('radar','No radar (editais)',rd.toLocaleString('pt-BR'))}${K('cal','Linhas de PCA (previsão)',pc.toLocaleString('pt-BR'))}${K('coin','Comissão estimada',brl(est))}${K('coin','Comissão recebida',brl(rec),'g')}</div>
 <h3 style="margin:6px 0 10px;font-size:15px">Melhores oportunidades abertas</h3>
 ${top.length?top.map(x=>{const o=x.oportunidades;return `<div class="card"><div class="row"><div><div class="t">${esc((o.objeto||'').slice(0,200))}</div><div class="m">${esc(o.orgao_nome)} · ${esc(o.uf)}</div><span class="tag ok">score ${x.score??'—'}</span><span class="tag">${o.valor_sigiloso?'valor sigiloso':brl(o.valor_estimado)}</span>${prazo(o.data_fim_proposta)}</div><button class="sec sm" onclick="irPreco(this.dataset.t)" data-t="${esc((o.objeto||'').slice(0,80))}">Pesquisar preço</button></div></div>`}).join(''):'<div class="card vazio">Nenhuma oportunidade no radar ainda.</div>'}`;},

async precos(){
 main.innerHTML=`<div class="top"><div><h2>Pesquisa de preços</h2><p class="sub">Preços praticados em contratações públicas (Compras.gov.br): mínimo, mediana e média para embasar a proposta.</p></div></div>
 <div class="bar"><select id="pt"><option value="M">Material</option><option value="S">Serviço</option></select><input id="pq" class="grow" type="search" placeholder="Nome do item no catálogo (ex.: CARNE BOVINA, ARROZ, CADEIRA, LIMPEZA)…"><button onclick="buscarCat()">Buscar no catálogo</button></div>
 <div id="cat"></div><div id="pr"></div>`;
 $('#pq').onkeydown=e=>{if(e.key==='Enter')buscarCat();};
 if(window.ARG){$('#pq').value=String(window.ARG).split(/\s+/).slice(0,3).join(' ');window.ARG=null;await buscarCat();}},

async radar(){
 const perfis=(await q(sb.from('perfis_busca').select('id,nome').order('nome'))).data;
 main.innerHTML=`<div class="top"><div><h2>Radar de oportunidades</h2><p class="sub">Editais e previsões que combinam com os seus perfis, ordenados por score.</p></div></div><div class="bar"><select id="fp"><option value="">Todos os perfis</option>${perfis.map(p=>`<option value="${p.id}">${esc(p.nome)}</option>`).join('')}</select>
 <select id="fs"><option value="">Status (todos)</option>${opts(STATUS)}</select><select id="ff"><option value="">Edital + PCA</option><option value="e">Só editais</option><option value="p">Só PCA</option></select>
 <select id="fu"><option value="">UF (todas)</option>${opts(UFS)}</select><input id="fq" type="search" placeholder="Buscar no objeto…"></div><div id="lista"></div>`;
 const carregar=async()=>{
  let r=sb.from('radar').select('id,score,status,observacoes,perfil_id,perfis_busca(nome),oportunidades(objeto,orgao_nome,uf,municipio,modalidade,valor_estimado,valor_sigiloso,data_fim_proposta,link_pncp),pca_itens(descricao,valor_total,data_desejada,pca_planos(orgao_nome,uf))').order('score',{ascending:false}).limit(120);
  if($('#fp').value)r=r.eq('perfil_id',$('#fp').value);if($('#fs').value)r=r.eq('status',$('#fs').value);
  if($('#ff').value==='e')r=r.not('oportunidade_id','is',null);if($('#ff').value==='p')r=r.not('pca_item_id','is',null);
  let rows=(await q(r)).data;const uf=$('#fu').value,t=$('#fq').value.toLowerCase();
  rows=rows.filter(x=>{const o=x.oportunidades,p=x.pca_itens;const u=o?o.uf:p?.pca_planos?.uf;const tx=(o?o.objeto:p?.descricao||'').toLowerCase();return(!uf||u===uf)&&(!t||tx.includes(t));});
  $('#lista').innerHTML=rows.length?rows.map(x=>{const o=x.oportunidades,p=x.pca_itens;
   const titulo=o?o.objeto:p?.descricao,org=o?o.orgao_nome:p?.pca_planos?.orgao_nome,uf=o?o.uf:p?.pca_planos?.uf;
   return `<div class="card"><div class="row"><div><div class="t">${esc((titulo||'').slice(0,220))}</div><div class="m">${esc(org)} · ${esc(uf)}${o?' · '+esc(o.municipio||''):''}</div>
   <span class="tag ${o?'':'w'}">${o?'Edital · '+esc(o.modalidade||''):'PCA · previsão'}</span><span class="tag">${esc(x.perfis_busca?.nome)}</span><span class="tag ok">score ${x.score??'—'}</span>
   ${o?`<span class="tag">${o.valor_sigiloso?'valor sigiloso':brl(o.valor_estimado)}</span>${prazo(o.data_fim_proposta)}<span class="m"> encerra ${dt(o.data_fim_proposta)}</span>`:`<span class="tag">${brl(p?.valor_total)}</span><span class="m"> desejada ${dt(p?.data_desejada)}</span>`}
   ${o?.link_pncp?` <a class="l" href="${esc(o.link_pncp)}" target="_blank" rel="noopener">abrir no PNCP ↗</a>`:''} <button class="sec sm" onclick="irPreco(this.dataset.t)" data-t="${esc((titulo||'').slice(0,80))}">Pesquisar preço</button></div>
   <select style="width:150px" onchange="mudarStatus(${x.id},this.value)">${opts(STATUS,x.status)}</select></div></div>`;}).join(''):'<div class="vazio">Nada por aqui ainda. Rode a coleta e o radar, ou ajuste os filtros.</div>';};
 ['fp','fs','ff','fu'].forEach(i=>$('#'+i).onchange=carregar);let tm;$('#fq').oninput=()=>{clearTimeout(tm);tm=setTimeout(carregar,300);};await carregar();},

async oportunidades(){
 main.innerHTML=`<div class="top"><div><h2>Editais abertos</h2><p class="sub">Todas as contratações com propostas abertas no PNCP.</p></div></div><div class="bar"><input id="fq" type="search" placeholder="Buscar no objeto (ex.: carne bovina)…"><select id="fu"><option value="">UF</option>${opts(UFS)}</select>
 <input id="vmin" type="number" placeholder="Valor mín."><input id="vmax" type="number" placeholder="Valor máx."><label style="margin:0;align-self:center"><input id="ab" type="checkbox" checked style="width:auto"> só abertos</label><button onclick="pg=0;go()">Buscar</button></div><div id="lista"></div><div class="pg" id="pg"></div>`;
 window.pg=0;window.go=async()=>{const N=30;let r=sb.from('oportunidades').select('objeto,orgao_nome,uf,municipio,modalidade,valor_estimado,valor_sigiloso,data_fim_proposta,link_pncp,situacao',{count:'exact'}).order('data_fim_proposta',{ascending:true}).range(pg*N,pg*N+N-1);
  const t=$('#fq').value.trim();if(t)r=r.textSearch('objeto_tsv',t,{type:'websearch',config:'portuguese'});if($('#fu').value)r=r.eq('uf',$('#fu').value);
  if($('#vmin').value)r=r.gte('valor_estimado',$('#vmin').value);if($('#vmax').value)r=r.lte('valor_estimado',$('#vmax').value);if($('#ab').checked)r=r.gte('data_fim_proposta',new Date().toISOString());
  const {data,count}=await q(r);$('#lista').innerHTML=data.length?data.map(o=>`<div class="card"><div class="t">${esc((o.objeto||'').slice(0,240))}</div><div class="m">${esc(o.orgao_nome)} · ${esc(o.uf)} · ${esc(o.municipio||'')}</div>

async comissoes(){

 const com=c=>c.base_valor==null?Number(c.valor_estimado_comissao||0):Number(c.base_valor)*Number(c.percentual??1)/100;

 <div class="card"><div class="t">Novo contrato</div><p class="m">A comissão é o percentual (padrão 1%) sobre a base que você informar: o valor do contrato ou a margem da empresa, conforme a licitação.</p><div class="f2"><div><label>Empresa</label><input id="cn"></div><div><label>CNPJ</label><input id="cc"></div><div><label>Base da comissão</label><select id="cb" onchange="calcCom()"><option value="contrato">Valor do contrato</option><option value="margem">Margem da empresa</option></select></div><div><label>Valor da base (R$)</label><input id="cv" type="number" oninput="calcCom()"></div><div><label>Percentual (%)</label><input id="cp" type="number" step="0.01" value="1" oninput="calcCom()"></div><div><label>Comissão calculada</label><input id="ce" disabled></div></div><button style="margin-top:10px" onclick="novaCom()">Adicionar contrato</button></div>
 ${data.length?`<div class="card"><table><tr><th>Empresa</th><th>Base</th><th>Valor da base</th><th>%</th><th>Comissão</th><th>Recebido</th><th>Status</th></tr>${data.map(c=>`<tr><td>${esc(c.empresa_nome)}<div class="m">${esc(c.empresa_cnpj||'')}</div></td><td><select onchange="updCom(${c.id},{base_tipo:this.value})">${opts(['contrato','margem'],c.base_tipo)}</select></td><td><input type="number" style="width:120px" value="${c.base_valor??''}" onchange="updCom(${c.id},{base_valor:this.value===''?null:Number(this.value)})"></td><td><input type="number" step="0.01" style="width:70px" value="${c.percentual??1}" onchange="updCom(${c.id},{percentual:Number(this.value)})"></td><td>${brl(com(c))}</td><td><input type="number" style="width:110px" value="${c.valor_recebido}" onchange="upd('contratos_comissao',${c.id},{valor_recebido:this.value})"></td><td><select onchange="upd('contratos_comissao',${c.id},{status:this.value})">${opts(['em_negociacao','assinado','em_execucao','concluido','cancelado'],c.status)}</select></td></tr>`).join('')}</table></div>`:''}`;},

const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase();
const irPreco=t=>ir('precos',t);
async function buscarCat(){
 const t=norm($('#pq').value).replace(/[^A-Z0-9 ]/g,' ').trim();if(!t)return;
 let r=sb.from('catalogo').select('tipo,codigo,nome,grupo,classe').eq('tipo',$('#pt').value).limit(25);
 t.split(/\s+/).filter(w=>w.length>1).forEach(w=>r=r.ilike('nome_busca','%'+w+'%'));
 const {data}=await q(r);
 $('#cat').innerHTML=data.length?`<div class="m" style="margin-bottom:6px">Escolha o item do catálogo mais próximo:</div><div class="res">${data.map(c=>`<button onclick="calcPreco('${c.tipo}','${c.codigo}','${esc(c.nome).replace(/'/g,'')}')"><b>${esc(c.nome)}</b><div class="m">${esc(c.grupo||'')} · ${esc(c.classe||'')} · código ${c.codigo}</div></button>`).join('')}</div>`:'<div class="card vazio">Nada no catálogo para essa busca. Tente uma palavra mais simples (ex.: CARNE, ARROZ). Se o catálogo ainda não foi carregado, rode a coleta no modo “catalogo”.</div>';}
window.PS={};
async function calcPreco(tipo,codigo,nome,un){
 PS.tipo=tipo;PS.codigo=codigo;PS.nome=nome;const uf=$('#pu')?$('#pu').value:'',meses=$('#pm')?$('#pm').value:'12';
 $('#pr').innerHTML='<div class="vazio">Consultando preços…</div>';
 const {data:s}=await sb.auth.getSession();
 const r=await fetch(`/api/preco?tipo=${tipo}&codigo=${codigo}&uf=${uf}&meses=${meses}${un?'&un='+encodeURIComponent(un):''}`,{headers:{authorization:'Bearer '+s.session.access_token}});
 const d=await r.json().catch(()=>({erro:'resposta inválida'}));
 if(!r.ok||d.erro){$('#pr').innerHTML=`<div class="card vazio">Erro: ${esc(d.erro||r.status)}</div>`;return;}
 PS.d=d;const e=d.estat;
 const ctl=`<div class="bar"><div class="t" style="align-self:center;flex:1;min-width:220px">${esc(nome)}</div><select id="pu" onchange="calcPreco(PS.tipo,PS.codigo,PS.nome)"><option value="">Brasil todo</option>${UFS.map(u=>`<option ${u===d.uf?'selected':''}>${u}</option>`).join('')}</select><select id="pm" onchange="calcPreco(PS.tipo,PS.codigo,PS.nome)">${[6,12,24,36].map(m=>`<option value="${m}" ${m===d.meses?'selected':''}>últimos ${m} meses</option>`).join('')}</select>${d.unidades.length>1?`<select onchange="calcPreco(PS.tipo,PS.codigo,PS.nome,this.value)">${d.unidades.slice(0,8).map(u=>`<option value="${esc(u.sigla)}" ${u.sigla===d.unidade?'selected':''}>unidade ${esc(u.sigla)} (${u.n})</option>`).join('')}</select>`:''}</div>`;
 if(!e){$('#pr').innerHTML=ctl+'<div class="card vazio">Sem preços registrados para esse filtro. Tente ampliar o período ou tirar a UF.</div>';return;}
 const B=(l,v,c='')=>`<div class="card"><div class="m">${l}</div><div class="big ${c}">${brl2(v)}</div></div>`;
 $('#pr').innerHTML=ctl+`<div class="pbox">${B('Mínimo (sem outliers)',e.minimo_robusto,'g')}${B('Mediana',e.mediana)}${B('Média (sem outliers)',e.media_robusta)}${B('Máximo',e.maximo)}<div class="card"><div class="m">Registros</div><div class="big">${e.n}</div></div></div>
 <p class="m">Preço unitário em ${esc(d.unidade)} · ${e.n} compras (${e.n_sem_outliers} após remover valores discrepantes)${d.parcial?` · amostra dos ${d.lidos} registros mais recentes de ${d.total_api}`:''}. Mínimo absoluto: ${brl2(e.minimo)}.</p>
 <div class="card"><div class="t" style="margin-bottom:8px">Simulador de margem e comissão</div><div class="f2" style="grid-template-columns:repeat(4,1fr)"><div><label>Quantidade</label><input id="sq" type="number" value="1" oninput="sim()"></div><div><label>Preço de venda unit. (R$)</label><input id="sp" type="number" step="0.01" value="${(e.mediana??0).toFixed(2)}" oninput="sim()"></div><div><label>Custo unit. (R$)</label><input id="sc" type="number" step="0.01" value="${(e.minimo_robusto*0.8).toFixed(2)}" oninput="sim()"></div><div><label>Comissão (%)</label><input id="sx" type="number" step="0.01" value="1" oninput="sim()"></div></div><div id="so" style="margin-top:12px"></div></div>
 <div class="card"><div class="t" style="margin-bottom:6px">Por UF</div><table><tr><th>UF</th><th>Compras</th><th>Mínimo</th><th>Mediana</th><th>Média</th></tr>${d.ufs.slice(0,12).map(u=>`<tr><td>${esc(u.uf)}</td><td>${u.n}</td><td>${brl2(u.minimo)}</td><td>${brl2(u.mediana)}</td><td>${brl2(u.media)}</td></tr>`).join('')}</table></div>
 <div class="card"><div class="t" style="margin-bottom:6px">Compras recentes</div><table><tr><th>Data</th><th>Preço</th><th>Qtd</th><th>Órgão / UF</th><th>Fornecedor</th></tr>${d.amostra.map(a=>`<tr><td>${dt(a.data)}</td><td>${brl2(a.preco)}</td><td>${a.qtd??''} ${esc(a.un)}</td><td>${esc(a.orgao||a.uasg||'')}<div class="m">${esc(a.municipio||'')} · ${esc(a.uf||'')}</div></td><td>${esc(a.fornecedor||'')}<div class="m">${esc(a.marca||'')}</div></td></tr>`).join('')}</table></div>
 <div class="card"><div class="t" style="margin-bottom:6px">Fornecedores que mais vendem este item (possíveis clientes)</div><table><tr><th>Empresa</th><th>CNPJ</th><th>UF</th><th>Vendas</th><th>Valor</th></tr>${d.fornecedores.map(f=>`<tr><td>${esc(f.nome)}</td><td>${esc(f.cnpj||'')}</td><td>${esc(f.uf||'')}</td><td>${f.n}</td><td>${brl(f.valor)}</td></tr>`).join('')}</table></div>`;
 sim();}
const brl2=v=>v==null?'—':Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
function sim(){const n=+$('#sq').value||0,p=+$('#sp').value||0,c=+$('#sc').value||0,x=+$('#sx').value||0;const ct=n*p,mg=n*(p-c),pc=p?(p-c)/p*100:0;
 $('#so').innerHTML=`<div class="pbox"><div class="card"><div class="m">Valor do contrato</div><div class="big">${brl2(ct)}</div></div><div class="card"><div class="m">Margem da empresa</div><div class="big ${mg>=0?'g':''}">${brl2(mg)}</div><div class="m">${pc.toFixed(1)}% sobre a venda</div></div><div class="card"><div class="m">Comissão sobre o contrato</div><div class="big">${brl2(ct*x/100)}</div></div><div class="card"><div class="m">Comissão sobre a margem</div><div class="big">${brl2(Math.max(mg,0)*x/100)}</div></div></div>`;}

async function upd(t,id,v){const {error}=await sb.from(t).update(v).eq('id',id);if(error)alert('Erro: '+error.message);}
const mudarStatus=(id,s)=>upd('radar',id,{status:s}),mudarEtapa=(id,e)=>upd('matches',id,{etapa:e});

async function updCom(id,v){const {data:c,error}=await sb.from('contratos_comissao').update(v).eq('id',id).select().single();if(error)return alert('Erro: '+error.message);
 if(c.base_valor!=null){await sb.from('contratos_comissao').update({valor_estimado_comissao:Number(c.base_valor)*Number(c.percentual??1)/100}).eq('id',id);}ir('comissoes');}

async function salvarPerfil(id){const c=$('#p'+id);const arr=v=>v.split(',').map(s=>s.trim()).filter(Boolean),num=v=>v===''?null:Number(v);const g=k=>c.querySelector(`[data-k=${k}]`);
 const v={ativo:g('ativo').checked,palavras_incluir:arr(g('palavras_incluir').value),palavras_excluir:arr(g('palavras_excluir').value),ufs:arr(g('ufs').value.toUpperCase()),modalidades:arr(g('modalidades').value),valor_min:num(g('valor_min').value),valor_max:num(g('valor_max').value),dias_min_abertura:Number(g('dias_min_abertura').value),score_minimo:Number(g('score_minimo').value)};
 const {error}=await sb.from('perfis_busca').update(v).eq('id',id);alert(error?error.message:'Perfil salvo.');}
async function novoPerfil(){const n=prompt('Nome do novo perfil:');if(!n)return;const {error}=await sb.from('perfis_busca').insert({nome:n});if(error)alert(error.message);else ir('perfis');}
$('#lg').innerHTML=$('#lg2').innerHTML=svg('doc');$('#lg').firstChild.style.cssText=$('#lg2').firstChild.style.cssText='width:22px;height:22px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round';
$('#pw').onkeydown=e=>{if(e.key==='Enter')entrar();};
iniciar();
