name: Coleta PNCP

on:
  schedule:
    - cron: "17 9,21 * * *"   # 06:17 e 18:17 (horario de Brasilia)
  workflow_dispatch:
    inputs:
      modo:
        description: "editais, pca, radar, catalogo, ia ou tudo"
        default: "tudo"
      max_ia:
        description: "maximo de editais para a IA classificar"
        default: "300"

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python coletor.py "$MODO"
        env:
          MODO: ${{ github.event.inputs.modo || 'tudo' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MAX_IA: ${{ github.event.inputs.max_ia || '300' }}
