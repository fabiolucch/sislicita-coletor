name: Coleta PNCP

on:
  schedule:
    - cron: "17 9,21 * * *"   # 06:17 e 18:17 (horario de Brasilia)
  workflow_dispatch:
    inputs:
      modo:
        description: "editais, pca, radar, catalogo, ia, radar_ia, itens, vigia, docs, radar_pca_ia, briefing, aprender, alertas, contratos, resultados, fornecedores ou tudo"
        default: "tudo"
      max_ia:
        description: "maximo de editais para a IA classificar"
        default: "300"

concurrency:
  group: coleta-pncp
  cancel-in-progress: false   # uma coleta por vez; as outras esperam na fila

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pypdf
      - run: python coletor.py "$MODO"
        env:
          MODO: ${{ github.event.inputs.modo || 'tudo' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MAX_IA: ${{ github.event.inputs.max_ia || '300' }}
